# ===============================================================================
# FILE PURPOSE:
# Configuration file for Alembic database migration tool.
# Defines logging controls, script template locations, and migration execution options.
#
# CONNECTED FILES & FOLDERS:
# - Connected to: backend/alembic/env.py (Executed when migrations run)
# - Connected to: backend/alembic/versions/ (Stores revision scripts)
# - Connected to: backend/app/config.py (Reads DB connection string)
# ===============================================================================

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
